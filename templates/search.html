{% extends "base.html" %}
{% block content %}

<h1>Buscar productos</h1>

<div class="card">
    <form method="POST">
        <input name="query" placeholder="Buscar por nombre o código...">
        <button>Buscar</button>
    </form>
</div>

{% if results %}
<table>
    <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Precio</th>
    </tr>

    {% for row in results %}
    <tr>
        <td>{{ row.Barcode }}</td>
        <td>{{ row.Name }}</td>
        <td>{{ row.Price }}</td>
    </tr>
    {% endfor %}
</table>
{% endif %}

{% endblock %}
